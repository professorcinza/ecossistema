name: lint-specs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint de specs (registry.md + estrutura de domínios)
        run: python3 .github/scripts/lint_specs.py --root .

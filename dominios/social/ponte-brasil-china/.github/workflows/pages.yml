name: Deploy da Ponte no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        run: |
          mkdir -p site/prototypes/0001-ponte
          cp prototypes/0001-ponte/index.html site/prototypes/0001-ponte/
          cp -r docs site/docs
          cp README.md README.en.md README.zh.md LICENSE site/
          printf '%s' '<!doctype html><html lang=pt><head><meta charset=utf-8><title>Ponte · Brasil–China</title><meta http-equiv=refresh content="0; url=prototypes/0001-ponte/"></head><body><p><a href="prototypes/0001-ponte/">Ponte — abrir a página</a></p></body></html>' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
